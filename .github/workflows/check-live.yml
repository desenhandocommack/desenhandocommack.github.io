name: Check Live Status

on:
  schedule:
    # Roda a cada 5 minutos
    - cron: "*/5 * * * *"
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  check-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para salvar as alterações no repositório

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check channels and update JSON
        run: |
          node -e "
          async function run() {
            const fs = require('fs');
            
            // 1. Ler o arquivo content/cronograma/agenda.json
            const rawData = fs.readFileSync('content/cronograma/agenda.json', 'utf8');
            const data = JSON.parse(rawData);
            
            // 2. Verificar Twitch (Decapi)
            let isTwitchLive = false;
            try {
              const twitchRes = await fetch('https://decapi.me/twitch/uptime/desenhandocommack');
              const twitchText = await twitchRes.text();
              isTwitchLive = !twitchText.includes('offline');
              console.log('Twitch status:', isTwitchLive ? 'LIVE' : 'Offline');
            } catch (err) {
              console.error('Erro ao verificar Twitch:', err);
            }
            
            // 3. Verificar YouTube (Canonical live check)
            let isYtLive = false;
            let ytLiveUrl = 'https://www.youtube.com/@desenhandocommack/streams';
            try {
              const ytRes = await fetch('https://www.youtube.com/@desenhandocommack/live');
              const ytText = await ytRes.text();
              const canonicalMatch = ytText.match(/<link rel=\"canonical\" href=\"([^\"]+)\"/);
              if (canonicalMatch && canonicalMatch[1].includes('/watch?v=')) {
                isYtLive = true;
                ytLiveUrl = canonicalMatch[1];
              }
              console.log('YouTube status:', isYtLive ? 'LIVE' : 'Offline');
            } catch (err) {
              console.error('Erro ao verificar YouTube:', err);
            }
            
            // 4. Lógica de atualização
            let changed = false;
            const wasActive = data.aoVivo.ativo;
            const nowActive = isTwitchLive || isYtLive;
            
            if (wasActive !== nowActive) {
              data.aoVivo.ativo = nowActive;
              changed = true;
            }
            
            if (nowActive) {
              const activePlat = isYtLive ? 'youtube' : 'twitch';
              const activeLink = isYtLive ? ytLiveUrl : 'https://www.twitch.tv/desenhandocommack/about';
              const activeCanal = isYtLive ? '@desenhandocommack' : 'desenhandocommack';
              
              if (data.aoVivo.plataforma !== activePlat) {
                data.aoVivo.plataforma = activePlat;
                changed = true;
              }
              if (data.aoVivo.link !== activeLink) {
                data.aoVivo.link = activeLink;
                changed = true;
              }
              if (data.aoVivo.canal !== activeCanal) {
                data.aoVivo.canal = activeCanal;
                changed = true;
              }
              
              // Se antes não estava ativa, promove do agendamento de hoje se houver
              if (!wasActive) {
                // Pega a data de hoje no fuso de São Paulo (DD/MM)
                const options = { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit' };
                const todayStr = new Intl.DateTimeFormat('pt-BR', options).format(new Date());
                
                const todayEvent = data.proximas.find(p => p.data === todayStr);
                if (todayEvent) {
                  data.aoVivo.titulo = todayEvent.titulo;
                  data.aoVivo.categoria = todayEvent.categoria;
                  data.aoVivo.capa = todayEvent.capa;
                  changed = true;
                  console.log('Promovido evento agendado para hoje:', todayEvent.titulo);
                }
              }
            }
            
            // 5. Salvar se houver alterações
            if (changed) {
              fs.writeFileSync('content/cronograma/agenda.json', JSON.stringify(data, null, 2) + '\n', 'utf8');
              console.log('content/cronograma/agenda.json atualizado com sucesso.');
            } else {
              console.log('Nenhuma alteração detectada.');
            }
          }
          run().catch(console.error);
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add content/cronograma/agenda.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update live status" && git push)
