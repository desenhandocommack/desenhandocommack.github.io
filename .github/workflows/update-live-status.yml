name: Atualiza status da live

on:
  workflow_dispatch:
    inputs:
      event-type:
        description: "Event type"
        default: live
        type: choice
        options:
          - live
          - upcoming

jobs:
  update-live-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AGENDA: content/cronograma/agenda.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Busca video ao vivo
        id: search
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          sleep 10

          RESPONSE=$(curl -s "https://www.googleapis.com/youtube/v3/search?part=snippet&fields=items(id(videoId),snippet(title,description))&eventType=${{ inputs.event-type }}&type=video&channelId=${CHANNEL_ID}&key=${API_KEY}")

          VIDEO_ID=$(echo "$RESPONSE" | jq -r '.items[0].id.videoId // empty')

          echo -e '```json\n'"$RESPONSE"'\n```' >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$VIDEO_ID" ]; then
            echo 'Não há live em andamento.'
            jq '.atualizado = (now | strftime("%d/%m/%Y")) | .aoVivo.ativo = false' $AGENDA > tmp.json && mv tmp.json $AGENDA
            exit 0
          fi

          echo 'Entrado live em andamento.'

          VIDEO_ID=$(jq -r '.items[0].id.videoId' <<< "$RESPONSE")
          TITULO=$(jq -r '.items[0].snippet.title' <<< "$RESPONSE")
          DESCRICAO=$(jq -r '.items[0].snippet.description' <<< "$RESPONSE")
          CATEGORIA=$(echo "$DESCRICAO" | grep -oE '\[Categoria: [^]]+\]' | sed -E 's/\[Categoria: (.+)\]/\1/')

          DIAS=('Segunda-feira' 'Terça-feira' 'Quarta-feira' 'Quinta-feira' 'Sexta-feira' 'Sábado' 'Domingo')
          DIA_PT="${DIAS[$(date -u +%u)-1]}"
          DATA=$(date -u +%d/%m)

          jq --arg titulo "$TITULO" \
             --arg categoria "$CATEGORIA" \
             --arg dia "$DIA_PT" \
             --arg data "$DATA" \
             --arg link "https://www.youtube.com/watch?v=${VIDEO_ID}" \
             --arg cover "https://i.ytimg.com/vi/${VIDEO_ID}/maxresdefault_live.jpg" \
             --arg atualizado "$(date -u +%d/%m/%Y)" \
             '.atualizado = $atualizado
              | .aoVivo.ativo = true
              | .aoVivo.titulo = $titulo
              | .aoVivo.categoria = $categoria
              | .aoVivo.capa = $cover
              | .aoVivo.dia = $dia
              | .aoVivo.data = $data
              | .aoVivo.link = $link' \
            $AGENDA > tmp.json && mv tmp.json $AGENDA

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $AGENDA
          git diff --staged --quiet || git commit -m "chore: atualiza status da live"
          git push
