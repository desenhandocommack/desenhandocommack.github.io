<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ if .IsHome }}Desenhando com Mack - Desenho e arte digital{{ else }}{{ .Title }} - Desenhando com Mack{{ end }}</title>

    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}Dicas de arte digital e cartoon, tutoriais passo a passo de Krita, processos de criação e inspiração diária para quem precisa de companhia.{{ end }}" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:title" content="{{ if .IsHome }}Desenhando com Mack - Desenho e arte digital{{ else }}{{ .Title }} - Desenhando com Mack{{ end }}" />
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}Dicas de arte digital e cartoon, tutoriais passo a passo de Krita, processos de criação e inspiração diária para quem precisa de companhia.{{ end }}" />
    <meta property="og:image" content="{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ "images/preview-site.png" | absURL }}{{ end }}" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Desenhando com Mack" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{{ .Permalink }}" />
    <meta name="twitter:title" content="{{ if .IsHome }}Desenhando com Mack - Desenho e arte digital{{ else }}{{ .Title }} - Desenhando com Mack{{ end }}" />
    <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}Dicas de arte digital e cartoon, tutoriais passo a passo de Krita, processos de criação e inspiração diária para quem precisa de companhia.{{ end }}" />
    <meta name="twitter:image" content="{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ "images/preview-site.png" | absURL }}{{ end }}" />

    {{ with resources.Get "styles/style.css" | resources.Fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" />
    {{ end }}

    <!--  -->

    {{ block "styles" . }}{{ end }}

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <link rel="icon" type="image/x-icon" href="/images/favicon-16x16.ico" />
    <link rel="icon" type="image/x-icon" sizes="16x16" href="/images/favicon-16x16.ico" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/images/favicon-32x32.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />

    {{ if not hugo.IsServer }}
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9490703409315867"
      crossorigin="anonymous"
    ></script>
    {{ end }}
  </head>

  <body>
    {{ partial "navbar.html" . }}

    <!--  -->

    <div class="main-content">
      {{ block "main" . }}{{ end }}
    </div>
    {{ partial "footer.html" . }}

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});

      // Bloqueia clique com botão direito (context menu) e arrastar em imagens e vídeos
      document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO' || e.target.closest('img') || e.target.closest('video')) {
          e.preventDefault();
        }
      });
      document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO' || e.target.closest('img') || e.target.closest('video')) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
