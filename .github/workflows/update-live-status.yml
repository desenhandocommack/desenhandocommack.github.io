name: YouTube live update

on:
  workflow_dispatch:
    inputs:
      empty-history:
        description: Should empty history array?
        default: false
        type: boolean
      event-type:
        description: Event type
        default: live
        type: choice
        options:
          - live
          - upcoming

jobs:
  update-live-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AGENDA_LIVE: data/lives/live.json
      AGENDA_HISTORY: data/lives/history.json
      AGENDA_UPCOMING: data/lives/upcoming.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Busca video ao vivo
        id: search
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          fetch_data() {
            local eventType="$1"
            local destination="$2"
            local shouldMoveToHistory="$3"
            local idList=$(curl -s "https://www.googleapis.com/youtube/v3/search?part=snippet&fields=items(id(videoId))&eventType=${eventType}&type=video&maxResults=50&channelId=${CHANNEL_ID}&key=${API_KEY}" | jq -r '[.items[].id.videoId] | join(",")')

            if [ -n "$idList" ]; then
              echo "IDs: $idList"
              local detailList=$(curl -s "https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&fields=items(id,snippet(title,description),liveStreamingDetails(scheduledStartTime))&maxResults=50&id=${idList}&key=${API_KEY}" | jq '.items')
              echo -e '```json\n'"$detailList"'\n```' >> "$GITHUB_STEP_SUMMARY"
              echo "$detailList" > "$destination"
              return
            fi

            echo "Nenhum vídeo marcado como $eventType."

            if [ "$shouldMoveToHistory" = "true" ]; then
              if [ -s "$destination" ]; then
                jq -s '.[0] + .[1]' "$AGENDA_HISTORY" "$destination" > "${AGENDA_HISTORY}.tmp" && mv "${AGENDA_HISTORY}.tmp" "$AGENDA_HISTORY"
              fi
              echo '[]' > "$destination"
            fi
          }

          if [ "${{ inputs.empty-history }}" = "true" ]; then
            echo '[]' > "$AGENDA_HISTORY"
          fi

          sleep 10

          fetch_data "${{ inputs.event-type }}" "$AGENDA_LIVE"     true
          fetch_data "upcoming"                 "$AGENDA_UPCOMING" false

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$AGENDA_LIVE" "$AGENDA_HISTORY" "$AGENDA_UPCOMING"
          git diff --staged --quiet || git commit -m "chore: atualiza status da live"
          git push
