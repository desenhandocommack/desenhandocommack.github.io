dos Problemas\"","permalink":"\"/mesa-digitalizadora-nao-funciona-solucoes/\"","description":"\"Veja 8 soluções para problemas com driver, caneta, pressão, Windows Ink, USB, serviços do Windows e cursor desenhando em um lugar diferente na mesa digitalizadora.\"","content":"\"Se a sua mesa digitalizadora não funciona ou começou a dar algum problema no Windows, talvez este post consiga te ajudar.\\nAo longo do tempo usando mesa digitalizadora, já passei por vários problemas diferentes. Às vezes a caneta simplesmente não responde, em outras a pressão para de funcionar. Também já aconteceu do cursor travar, de aparecer aquele círculo do Windows quando eu clicava com a caneta e até de eu encostar a caneta em um lugar e o cursor aparecer completamente em outro.\\nE o pior é que, dependendo do problema, você pode ficar sem saber se a mesa está com defeito, se é o driver ou se alguma configuração do Windows mudou.\\nPor isso, resolvi reunir aqui algumas das soluções que já usei para tentar fazer a mesa voltar a funcionar normalmente. Algumas são bem simples, como trocar a porta USB ou reiniciar o serviço do driver, enquanto outras envolvem testar outra versão do driver ou mexer nas configurações do Windows Ink.\\nNão significa que todas essas soluções vão funcionar para qualquer problema, mas são coisas que vale a pena testar antes de pensar que sua mesa digitalizadora estragou.\\n1. Veja se o computador está reconhecendo a mesa Antes de começar a mexer em um monte de configurações, eu verificaria se o computador realmente tá reconhecendo a mesa.\\nSe o software do fabricante reconhecer a mesa normalmente, já sabemos que existe comunicação entre o computador e o dispositivo. Agora, se você conecta a mesa e o programa simplesmente não reconhece nada, eu começaria a investigar outras coisas.\\nPode ser o driver.\\nPode ser a porta USB.\\nPode ser o cabo.\\nE, em alguns casos, pode ser algum problema no próprio dispositivo.\\nEssa verificação já ajuda bastante porque evita ficar tentando configurar a caneta quando o problema está, na verdade, na conexão da mesa com o computador.\\n2. Troque a porta USB Essa é provavelmente uma das soluções mais simples da lista, mas vale muito a pena testar.\\nSe a mesa não está funcionando, desconecte o USB e coloque em outra porta do computador. Na época que eu usava a minha primeira mesa digitalizadora era o que eu mais fazia.\\nSe você tiver utilizando um hub USB, adaptador ou algum tipo de extensão, também vale fazer um teste conectando a mesa diretamente no computador.\\nSe você mudar a porta e a mesa voltar a funcionar normalmente, provavelmente o problema não estava no driver ou na configuração da caneta.\\nEstava na conexão que também é algo muito comum de acontecer.\\n3. Verifique o cabo Se o cabo da sua mesa for removível, vale dar uma olhada nele também. Com o tempo de uso o cabo pode ficar com mau contato e causar problemas estranhos.\\nA mesa pode funcionar durante alguns minutos e depois parar.\\nPode ficar desconectando e conectando sozinha, que era o caso da minha antiga mesa digitalizadora porque o conector já estava frouxo.\\nPode funcionar dependendo da posição do cabo.\\nOu simplesmente pode não ser reconhecida pelo computador.\\nSe você tiver outro cabo compatível, faça um teste.\\nTambém vale observar se o conector está frouxo ou se o cabo apresenta algum sinal de desgaste, principalmente pra quem tem gatos em casa, não é difícil encontrar um cabo todo mordido.\\n4. Teste desativar o Windows Ink Esse é um problema que incomoda bastante mas que é fácil de resolver.\\nVocê encosta a caneta na mesa e aparece aquele círculo do Windows na tela.\\nDependendo do programa e da configuração da sua mesa, o Windows Ink pode acabar interferindo na maneira como a caneta funciona.\\nO Windows Ink existe justamente para melhorar a utilização de canetas no Windows, mas nem sempre ele trabalha da maneira que você espera com todos os programas e drivers.\\nPor isso, uma coisa que vale a pena testar é desativar o Windows Ink.\\nPra fazer isso abrimos o programa que usamos pra configurar a mesa digitalizadora — no meu caso Wacom Tablet Properties ou Propriedades do Tablet Wacom, — e procure pela opção Use Windows Ink.\\nDependendo da versão essa opção pode mudar de lugar, então procura em todas as abas que ela vai tá em algum lugar dessa janela de propriedades.\\nSe a opção Windows Ink estiver ativada, desative e faça um teste. Veja se aquele círculo desapareceu e se a caneta passou a responder melhor.\\nSe melhorou e resolveu o problema, ótimo.\\nSe alguma outra função parou de funcionar, ative novamente.\\nSe não quiser desativar o Windows Ink pra tudo, pelo menos aqui na Wacom você consegue fazer configurações diferentes pra cada aplicativo.\\n5. Teste a mesa em outro programa Se a sua mesa não está funcionando em um programa mas estiver funcionando em outro, o problema provavelmente não está na mesa. O que já é um bom sinal.\\nPode ser alguma configuração específica do software que você tá usando e que precisa modificar ou uma incompatibilidade entre o programa e o driver.\\nSe tiver outro computador pra testar, melhor ainda, porque se ela apresentar o mesmo problema, aí começa a fazer mais sentido investigar a própria mesa, caneta ou o cabo.\\nNo caso do Krita, você pode ir no menu Configurações → Configurar o Krita → e ir até a aba Configurações do tablet.\\nNessa tela você vai encontrar a opção “Entrada API do tablet”.\\nExistem duas opções principais: WinTab e Entrada de mesa Windows 8+ (Windows Ink).\\nEssa configuração é importante porque o Krita pode receber os dados da sua mesa digitalizadora de maneiras diferentes.\\nGeralmente vamos usar Windows Ink se aquela opção do Windows Ink tiver ativada nas configurações das propriedades da sua mesa digitalizadora. Se você desativar o Windows Ink, o ideal é selecionar a outra opção.\\nSe ainda assim não funciona, tenta usar a outra opção, não custa nada testar.\\nDepois disso é necessário reiniciar o Krita pra que a alteração realmente tenha efeito. Depois só fazer o teste novamente.\\n6. Reinicie o driver pelos Serviços do Windows Uma das primeiras coisas que eu faço quando a mesa começa a apresentar algum problema é reiniciar o serviço do driver.\\nPra fazer isso vamos usar a tecla ⊞ Windows e buscar por Services, ou Serviços, se o Windows tiver em português. Também podemos usar o atalho ⊞ Windows + R e digitar services.msc pra abrir essa mesma janela de serviços.\\nNessa janela você vai encontrar uma lista enorme de serviços. Vamos procurar o serviço relacionado ao driver da nossa mesa de desenho.\\nO nome muda de acordo com o fabricante e com o driver instalado, então não adianta procurar necessariamente pelo mesmo nome que aparece aqui no meu computador se você usa uma marca de mesa digitalizadora diferente da minha.\\nQuando encontrar o serviço com o nome da sua mesa digitalizadora, clica nele e escolha a opção Restart, que é o Reiniciar. Espera um pouco até o Windows conseguir reiniciar o driver, fecha o programa de desenho, abre novamente e testa a caneta.\\nSempre que minha caneta para de funcionar a pressão isso aqui já resolve pra mim.\\nSó tome cuidado para não sair reiniciando ou desativando serviços aleatórios do Windows. Se você não sabe qual serviço pertence à sua mesa, não mexa nele. Dá uma pesquisada no Google antes que outras pessoas podem informar direitinho o nome de outros drivers.\\n7. Teste outra versão do driver Uma coisa que eu aprendi usando essas mesas digitalizadoras é que nem sempre o driver mais novo é o melhor para você.\\nÀs vezes a mesa estava funcionando normalmente e, depois de uma atualização, alguma coisa começa a dar problema.\\nA pressão para de funcionar, a caneta fica estranha, o programa não reconhece direito a mesa ou alguma função simplesmente deixa de funcionar.\\nQuando isso acontece, vale testar uma versão anterior do driver até encontrar a ideal. Em alguns casos, inclusive, uma versão mais antiga acaba funcionando melhor do que a versão mais recente.\\nBusque no Google pela marca da mesa e coloca Driver em seguida, já deve aparecer um link pro site oficial. Digitamos o modelo exato da nossa mesa digitalizadora e vamos ver se existem outras versões do driver disponíveis.\\nSe você acabou de atualizar o driver e o problema começou depois disso, eu começaria justamente testando a versão anterior.\\nAntes de instalar remova o driver atual. Depois instale a outra versão, reinicie o computador e faça o teste de novo. É uma solução simples, mas pode resolver aqueles problemas que parecem não ter explicação.\\n8. O cursor fica em um lugar e o desenho sai em outro Esse problema acontece comigo de vez em quando e eu sempre esqueço o que foi que eu fiz pra solucionar o problema. Geralmente é reiniciar o driver que resolve quase tudo, mas da última vez o problema foi outro.\\nBasicamente, você coloca a ponta da caneta em um lugar e o cursor aparece em outro. Ou então você começa a desenhar em uma determinada posição, mas o traço aparece deslocado na tela.\\nComo eu uso três monitores é normal isso acontecer. Então algumas soluções:\\nTente desinstalar e reinstalar o driver da mesa digitalizadora Como falei anteriormente, se você atualizou o driver recentemente e isso começou a acontecer, volte pra versão anterior.\\nVerificar o mapeamento da mesa digitalizadora Se a mesa estiver configurada para um monitor diferente daquele em que você está desenhando, o cursor pode acabar aparecendo em uma posição diferente do esperado.\\nConfira a área da mesa Outra coisa que vale verificar é a área ativa da mesa. Alguns drivers permitem definir exatamente em qual parte da mesa corresponde à tela.\\nSe essa área estiver configurada de maneira diferente do padrão, o movimento da caneta pode não corresponder ao movimento do cursor como você espera.\\nSe você não lembra de ter alterado essa configuração, tente restaurar o mapeamento para o padrão.\\nDepois configure novamente o monitor que você usa para desenhar.\\nVerifique a configuração dos monitores no Windows Também vale dar uma olhada nas configurações de tela do Windows.\\nClique com o botão direito na área de trabalho e entre em: Display Settings/Configurações de exibição.\\nVeja se os monitores estão configurados corretamente e confira a resolução e escala.\\nSe você acabou de trocar de monitor, alterou a resolução ou mudou a configuração das telas, vale conferir novamente o mapeamento da mesa porque pode desconfigurar com essas mudanças, aqui acontece direto.\\nSe for uma mesa com tela, verifique a calibração Se a sua mesa possui uma tela própria como a minha Cintiq 16, existe outra possibilidade: a calibração da caneta.\\nNesse caso, você pode tocar em um ponto da tela e o cursor aparecer alguns milímetros ou centímetros distante.\\nProcure no software da mesa por uma opção de Calibrate ou Calibrar.Normalmente o programa mostra alguns pontos na tela e pede para você tocar neles com a caneta.\\nFaça a calibração seguindo os pontos indicados.\\nDepois teste novamente.\\nComo saber por onde começar? Se você está com a mesa digitalizadora parada agora e não sabe qual dessas soluções testar primeiro, eu seguiria uma ordem bem simples.\\nPrimeiro, verificaria se o computador está reconhecendo a mesa.\\nDepois testaria outra porta USB e, se possível, outro cabo.\\nSe a mesa estiver sendo reconhecida, mas alguma função estiver estranha, aí eu partiria para reiniciar o driver.\\nSe o problema começou depois de uma atualização, testaria uma versão diferente do driver, que foi o que aconteceu comigo recentemente no dia de live.\\nSe a caneta estiver apresentando problemas de interação, testaria o Windows Ink.\\nE se o problema for especificamente o cursor aparecendo em um lugar diferente de onde você está tocando, verificaria primeiro o mapeamento da mesa, o monitor selecionado, a calibração e também testar uma versão diferente do driver se você atualizou qualquer coisa recentemente.\\nO mais importante é não sair alterando tudo de uma vez.\\nFaça um teste, veja o resultado e só depois passe para o próximo.\\nAssim fica muito mais fácil descobrir se o problema está no driver, no Windows, no programa que você está usando, na conexão ou na própria mesa digitalizadora.\\n\"","section":"\"blog\""},{"title":"\"Como desenhar o Clarêncio\"","permalink":"\"/como-desenhar-o-clarencio/\"","description":"\"Tutorial passo a passo de como desenhar o personagem Clarêncio da série de desenhos animados.\"","content":"\"Pra você que é fã série e quer aprender a desenhar o Clarêncio, separei um passo a passo de como desenhar esse personagem usando apenas 4 letras: U, C, O e I. É um ótima atividade pra você tentar fazer com o seu filho pra ajudar no desenvolvimento artístico e cognitivo dele.\\nAinda nesse post você pode baixar um guia completo e ilustrado de como desenhar o Clarêncio.\\nComo desenhar a cabeça do Clarêncio Passo 1 O Clarêncio é feito de várias formas simples. A forma geral da cabeça dele tem formato de um U invertido. Pra completar temos também um U mais aberto na parte de baixo da cabeça pra fechar a forma geral da cabeça.\\nPasso 2 Usando um C maior e outro menor conseguimos desenhar as bochechas do personagem. Note que elas são desenhadas quase no final da forma geral da cabeça que acabamos de desenhar. Isso vai ajudar no posicionamento dos outros elementos do rosto.\\nPasso 3 Agora, conectando quatro letras U — uma do lado da outra, então conseguimos completar o desenho do cabelo do Clarêncio. Você pode ver isso também como ondas do mar, é uma forma mais simples de pensar.\\nPasso 4 Bem próximo do cabelo vamos ter o desenho dos olhos do Clarêncio — que são bem grandes e redondos, bem parecidos com a forma da letra O. Então você pode aproveitar pra fazer mais um par desses — só que agora um pouco menor, pra desenhar a parte mais escura do olho.\\nPasso 5 Agora que os olhos estão desenhados no lugar certo temos a referência de onde o nariz vai ser desenhado. Basta desenhar a letra U invertida mais inclinada, e em seguida desenhar duas letras I na parte de dentro pra fazer as narinas.\\nPasso 6 Pra concluir só falta a boca que quando está sorrido é um comprido C preenchido com duas letras U para os dentes, e um U invertido para a língua.\\nDesenho completo Assista o passo a passo em vídeo \"","section":"\"blog\""},{"title":"\"Como exportar notas do seu Kindle\"","permalink":"\"/como-exportar-notas-do-kindle/\"","description":"\"Veja como salvar e guardar as suas notas do Kindle no seu computador.\"","content":"\"Passo 1 Conecte o Kindle no computador e abra a unidade do Kindle que aparece no Explorador de Arquivos.\\nÉ algo parecido com KINDLE (G:)\\nPasso 2 Abra a pasta documents → e encontre o arquivo My Clippings.\\nDentro desse documento de texto você vai encontrar todas as notas que você salvou no Kindle, tanto destaque como páginas que você marcou.\\nVai aparecer uma estrutura como essa abaixo:\\nPasso 3 Agora é só copiar e colar as notas do Kindle e salvar onde você quiser.\\n\"","section":"\"blog\""},{"title":"\"Atalhos do Krita\"","permalink":"\"/atalhos-padrao-do-krita/\"","description":"\" Esse post foi criado pra você que está dando os primeiros passos no Krita e que quer conhecer a lista dos atalhos padrão mais importantes pra começar a usar o Krita.\"","content":"\"Dominar atalhos de teclado é o segredo pra sair do modo iniciante e começar a desenhar e pintar no Krita com muito mais confiança acelerando o seu workflow. Nesse post eu trouxe os principais atalhos que você precisa pra começar no Krita.\\nAtalhos do Krita: Guia Essencial para Iniciantes Quando começamos a aprender um novo programa de desenho digital é comum ficar procurando ferramentas e menus usando o clique do mouse ou da caneta. Essa é uma forma válida porém muito lenta de fazer as coisas.\\nPra acelerar o seu trabalho em qualquer programa que você esteja usando é mais interessante usar os atalhos de teclado, porque basta um simples pressionar de tecla que já conseguimos acessar uma ferramenta que você precisa de forma super rápida.\\nNesse post vamos focar nos atalhos mais úteis pra você desenhista iniciante que está começando a aprender a usar o Krita.\\n1. Controle total do seu pincel/brush Pincel, borracha e balde de tinta são as principais ferramentas pra desenho e pintura digital. São os atalhos abaixo que vão te fazer acessar e ter maior controle das suas ferramentas de desenho.\\nB Seleciona a ferramenta pincel.\\nE Esse atalho liga e desliga o modo borracha, é ele que vai servir pra alternar entre o pincel atual e a borracha. Em vez de ficar trocando de ferramenta você vai apertar a tecla E pra apagar e apertar o E de novo pra voltar a pintar.\\n[ ] Diminuir e aumentar o tamanho do pincel. Você também pode fazer isso segurando o Shift e arrastando com o clique esquerdo.\\nF Com o F você ativa a ferramenta balde de tinta, ela serve pra agilizar o processo de colorização básica pois com um único clique você consegue preencher uma área com cor. Pra colorir fundos ou áreas grandes essa é a ferramenta perfeita.\\nCtrl + Clique esquerdo Pegar a cor de qualquer pixel na tela. É uma forma mais rápida de capturar cores que já foram usadas na tela.\\nI O Diminuir e aumentar a opacidade. A opacidade é o que vai controlar a transparência do pincel.\\nClique direito Acesso a paleta de cores rápida, com ele dá pra acessar cores e pincéis favoritos com um único clique.\\n2. Navegação básica Não são só os atalhos das ferramentas que agilizam o trabalho, é muito importante aprender a navegação básica.\\nEspaço + Clicar e arrastar pra se mover pela tela.\\nPra da Zoom (Aproximar e Afastar) use as teclas + - do teclado. Importante pra trabalhar em detalhes ou ver a composição geral de longe.\\n3. Atalhos Gerais Ctrl + Shift + A Esse atalho é para retirar seleções, vai ser importante logo após usar ferramentas de seleção.\\nCtrl + Shift + I Inverte a área selecionada.\\nT Serve pra mover camadas ou seleções.\\nCtrl + T Redimensiona, gira ou distorce uma camada.\\nCtrl + S Pra salvar o seu projeto. Mantenha o hábito de salvar seu projeto pra não perder horas de trabalho.\\nCtrl + Z Pra desfazer uma ação. Se você fizer um traço e se arrepender, use esse atalho pra desfazer.\\nCtrl + Shift + Z Esse atalho serve pra refazer as coisas, no caso ele volta uma ação que você desfez por engano.\\n4 5 6 Pra rotação da tela. Altera o ângulo da tela ajuda a conseguir fazer traços difíceis. V Segure V e arraste com o clique pra criar linha reta perfeita.\\nD Reseta as cores de primeiro plano e de plano de fundo pra preto e branco.\\nX Troca as cor da frente pela cor do fundo. Importante pra trabalhar rapidamente com duas cores.\\nM Ative ou desative o espelhamento horizontal usando o atalho M. Nós usamos essa ferramenta pra checar erros no desenho que o olho acostumado não vê.\\n4. Atalhos de Camadas Ctrl + J Duplicar camadas.\\nCtrl + E Mesclar a camada selecionada com a camada de baixo.\\nCtrl + G Colocar camadas selecionadas dentro de um grupo.\\nCtrl + C e Ctrl + V Copiar e Colar.\\nDel Limpar conteúdo de uma camada.\\nShift + Del Remover uma camada.\\nF5 Abrir o editor de pincel.\\nResumo dos atalhos de teclado Ferramenta Tecla de Atalho Pincel B Modo Borracha E Diminuir tamanho do pincel [ Aumentar tamanho do pincel ] Balde de tinta F Conta-gotas Ctrl + clique esquerdo Espelhamento horizontal M Paleta de cores e pincéis favoritos Clique direito Linhas retas V Resetar cores de primeiro plano e de plano de fundo pra preto e branco D Trocar cor de primeiro plano pela cor de plano de fundo X Se mover pela tela Espaço + clicar + arrastar Aproximar ou Afastar (Zoom) + ou - Retirar seleções Ctrl + Shift + A Inverter seleções Ctrl + Shift + I Redimensiona, gira e faz distorções Ctrl + T Pra salvar o seu projeto Ctrl + S Desfazer Ctrl + Z Refazer Ctrl + Shift + Z Girar pra esquerda, resetar rotação, girar pra direita 4, 5 e 6 Duplicar Ctrl + J Mesclar a camada selecionada com a camada de baixo Ctrl + E Colocar camadas selecionadas dentro de um grupo Ctrl + G Limpar conteúdo de uma camada Del Remover camada Shift + Del Editor de pincel F5 Vídeos complementares Playlist para Iniciantes no Krita Aprenda tudo para começar a desenhar no Krita Aprenda Krita em 5 minutos (Vídeo completo desse post ) \"","section":"\"blog\""},{"title":"\"Como desenhar no FireAlpaca\"","permalink":"\"/como-desenhar-no-firealpaca/\"","description":"\"Veja como começar do zero a usar o FireAlpaca, um programa gratuito e perfeito para iniciantes no desenho digital.\"","content":"\"Introdução O FireAlpaca é um dos programas mais interessantes para quem quer começar a desenhar no digital. É um programa leve, gratuito e simples de aprender, e isso é perfeito pra você que está começando agora a desenhar no computador.\\nNesse tutorial eu não vou te ensinar a desenhar — você pode acessar a minha playlist de tutorial de desenho para aprender a fazer isso, o que eu vou te mostrar é como usar o Firealpaca de forma que facilite você a colocar no mundo as ideias que você tem para criar.\\nIntrodução Conhecendo a interface Como navegar pela interface Como alterar o idioma para português Começando a desenhar Linha do desenho Colorindo o desenho no FireAlpaca Conhecendo a interface Antes de aprender qualquer programa novo, a interface é a primeira coisa que vamos precisar olhar. É aqui onde você vai encontrar painéis, ferramentas e todos os recursos que o software tem pra te oferecer, e a interface do FireAlpaca é super simples.\\n1. Menu Na parte superior do programa temos o menu de ações — comum em praticamente qualquer programa, é esse menu que te dá acesso às principais funções que ele tem.\\nSempre que precisar encontrar algum recurso ou funcionalidade, olhe o menu de ações. 2. Opções das ferramentas Logo abaixo ficam as opções das ferramentas, uma barra horizontal que te traz opções adicionais para cada ferramenta que estiver selecionada no momento. Aqui é o lugar onde você vai conseguir ajustar cada ferramenta do programa.\\n3. Barra de ferramentas Logo em seguida, temos a barra de ferramentas — uma barra vertical localizada na lateral esquerda da interface. Ela funciona em conjunto com as opções da ferramentas que acabamos de conhecer. Nesse espaço estão reunidos o pincel, a borracha, as ferramentas de seleção e todas as outras ferramentas do FireAlpaca.\\n4. Tela de Desenho Na área central temos a tela de desenho, que é a área que você tem para criar seus desenhos e ilustrações — vou te ensinar a navegar por ela daqui a pouco.\\n5. Painéis O restante está preenchido com painéis diversos. Uns servem para exibir informações e outros trazem controles importantes pra ajustar e gerenciar o nosso trabalho.\\nComo navegar pela interface Agora você precisa aprender a navegar pelo programa, vou te mostrar como ampliar a tela, se mover e rotacionar a sua tela de desenho — isso vai ser muito importante pra agilizar o seu trabalho e te ajudar a trabalhar com mais precisão.\\n1. Movimentação da tela A maneira mais rápida de movimentar a tela de desenho é segurar a barra de espaço do teclado enquanto clica e arrasta com o clique esquerdo. Você pode fazer a mesma coisa usando a ferramenta Hand Tool.\\n2. Ampliar ou Reduzir Pra aproximar ou afastar a visualização do desenho, usamos a roda do mouse. Por padrão, se você girar a roda do mouse pra frente ele afasta, se girar pra trás ele aproxima.\\nPra gente o contrário é mais intuitivo: girar a roda do mouse para frente para proximar a tela de visualização, e girar a roda do mouse para trás para afastar a tela de visualização.\\nSe preferir, voce pode alterar esse comportamento indo até o menu File → Environment Setting → e selecionar a opção Invert (upward to zoom in, downward to zoom out).\\n3. Rotação da tela Podemos ajustar facilmente a rotação da tela usando as teclas direcionais do teclado, para a esquerda e para a direita.\\n4. Inverter tela Quando precisar inverter temporariamente a tela de desenho inteira use a tecla direcional do teclado para baixo. Você vai notar na barra inferior do programa que ele vai indicar com (Flip) quando a tela estiver com esse modo ativado.\\nComo alterar o idioma do FireAlpaca Também é importante trocar o idioma do programa para o que é mais confortável pra você, isso facilita o nosso aprendizado no início, principalmente quando estamos aprendendo um novo software de desenho.\\nPara deixar o FireAlpaca em português vá até o menu Help → Language → e selecione o idioma escolhido. Se ele não fizer isso sozinho, você precisa fechar e abrir o FireAlpaca para que as atualizações sejam feitas.\\nCaso a opção Language esteja desabilitada como na imagem abaixo, você precisa fechar qualquer documento que esteja aberto — atualmente, o FireAlpaca não permite fazer a troca do idioma enquanto um arquivo está aberto.\\nPara fechar um arquivo, clique com o botão direito na barra do arquivo que fica na parte superior do programa e clique em Close.\\nComeçando a desenhar Passo 1: Criar o arquivo Primeiro vamos criar um novo arquivo vindo no menu Arquivo → Novo.\\nEm Largura e Altura escolhemos o tamanho desse arquivo — recomendo trabalhar com no mínimo 2000 pixels pro arquivo não ficar pequeno demais, mas isso varia dependendo da sua necessidade.\\nSe você está pensando em desenhos feitos apenas para postar nas redes sociais e na web de maneira geral, 96 de resolução é o suficiente.\\nPasso 2: Organizando as camadas Através do painel Camada conseguimos organizar e editar o nosso desenho, por isso é importante que ele esteja sempre aberto e encaixado em algum lugar da interface.\\nSempre que quiser abrir um painel na interface do FireAlpaca, vá até o menu Janela e selecione o painel desejado. Para fechar painéis, clique no X ao lado de cada painel. Por padrão o FireAlpaca traz uma camada inicial nomeada Camada 1. Com um duplo clique em cima dessa camada conseguimos alterar o nome dela para algo que faça mais sentido pra gente, vou dar a essa camada o nome de Cor do fundo.\\nEu prefiro que o fundo da minha tela de desenho seja branco, e não quadriculado — esse quadriculado está representando que a área do desenho está transparente. Por isso vou selecionar a Ferramenta Balde → selecionar a cor branco no painel Cor → e clicar em qualquer lugar da minha tela de desenho para preencher com a cor escolhida.\\nAgora, temos a camada Cor do fundo preenchida com branco.\\nUma boa prática é sempre bloquear as camadas que você não quer correr o risco de modificar sem querer, por isso vou clicar em Bloquear para travar a camada Cor do fundo. Ela vai servir apenas como um fundo temporário pra eu conseguir visualizar melhor o meu desenho enquanto eu tiver desenhando.\\nPasso 3: Criando uma nova camada Precisamos também de uma nova camada para fazer o nosso desenho, basta clicar no botão de Adicionar Camada desse mesmo painel. O que ele vai fazer é criar uma camada transparente do jeito que a gente precisa, você vai perceber isso pela miniatura da camada exibindo o padrão quadriculado como eu te falei.\\nEntão você pode trocar o nome da camada pra organizar desde o início o que é cada camada que você está criando — isso facilita encontrar mais rápido aquilo que você está procurando.\\nPasso 4: Comece a desenhar Agora que temos a nossa camada de fundo branca como um papel e uma camada transparente para o nosso desenho, podemos começar a desenhar!\\nApenas escolha uma cor qualquer no painel Cor → selecione a Ferramenta Pincel e em seguida escolha um dos pincéis no painel Pincel. Recomendo clicar e testar cada um deles antes de começar a desenhar.\\nNo painel Visualização do Pincel é possível alterar o tamanho do pincel.\\nA partir daqui é começar a fazer o seu desenho, nesse processo a Ferramenta Borracha vai ser muito importante também.\\nPara facilitar a trocar entre pincel e borracha, use atalhos de teclado — atalhos ajudam a tornar o processo mais rápido e fluido. Ferramenta Tecla de Atalho Ferramenta Pincel B Ferramenta Borracha E Tamanho do Pincel Anterior [ Próximo Tamanho do Pincel ] Desfazer ação Ctrl + Z Linha do desenho Depois de esboçar você pode querer fazer uma lineart pro desenho que você criou, e pra fazer a linha separada do esboço nós criamos uma nova camada — já te ensinei a fazer isso no Passo 3: Criando uma nova camada.\\nEssa é a ideia das camadas, ter a possibilidade de separar cada parte do nosso desenho em camadas diferentes. Dessa forma você não precisa ter medo de errar o desenho, basta organizar suas camadas.\\nAgora selecione a camada onde você fez o esboço ou a versão inicial do seu desenho — no meu caso camada \\u0026ldquo;desenho\\u0026rdquo;, e diminua a opacidade arrastando o slide de Opacidade localizado na parte superior do painel Camada.\\nO desenho precisa ficar claro o suficiente para não te atrapalhar a fazer a linha depois. Trave a camada do desenho clicando em Bloquear para não acabar desenhando nela sem querer → depois selecione a camada da linha para começar a fazer a lineart. Assim, cada parte do desenho fica na sua própria camada sem interferir na outra.\\nEstabilizador de traço Pra fazer linhas precisas, perfeitas e que não tremem é só ativar o estabilizador de traço. No FireAlpaca você vai encontrar essa opção na parte superior da interface depois que a Ferramenta Pincel estiver selecionada. Basta escolher um valor entre 0 e 100 em Correção (Globais).\\nQuanto maior o valor, mais suavizado o traço vai sair, porém mais lento também. Escolha o suficiente para você conseguir trabalhar direito.\\nColorindo o desenho no FireAlpaca Para colorir o desenho podemos esconder a camada do esboço clicando na bolinha que fica no início de cada camada. Agora nós não queremos mais visualizar o esboço, apenas a linha.\\nEntão, criamos uma nova camada para a cor, o detalhe é que essa camada Cor vai ficar abaixo da camada da linha. Se fosse o contrário, a cor iria cobrir a linha do seu desenho — a posição de cada camada na pilha de camadas importa.\\nPara alterar a posição de uma camada na pilha de camadas, clique com o clique esquerdo do mouse e arraste a camada para a posição desejada. Para essa etapa de colorir pode ser útil usar a Ferramenta Pincel para áreas pequenas e a Ferramenta Balde para áreas grandes. Quando selecionar o Balde verifique nas Opções da Ferramenta a opção Expandir. Aumente o valor para 1 ou mais — isso vai depender da espessura da sua linha, e agora você consegue preencher o desenho sem deixar espaços em branco.\\nE pra quando você precisar fazer efeitos apenas dentro de áreas que você já coloriu, ative a opção Proteger Alfa. Quando essa opção está ativada em uma camada você só vai conseguir desenhar ou colorir dentro das regiões que não são transparentes dessa camada.\\nTutoriais sobre o FireAlpaca em vídeo \"","section":"\"blog\""},{"title":"\"Krita ou FireAlpaca? Quem é melhor para iniciantes?\"","permalink":"\"/krita-ou-firealpaca-quem-e-melhor-para-iniciantes/\"","description":"\"Entre o Krita e o FireAlpaca, qual deles é a melhor opção para quem está começando a desenhar no digital?\"","content":"\"Introdução O Krita e o FireAlpaca são dois dos programas de desenho digital que eu mais gosto de recomendar pra quem tá em dúvida de qual software começar a usar. Uma porque o Krita é o meu software de desenho favorito — naturalmente eu vou falar sobre aquilo que eu uso e gosto, mas também porque eles trazem tudo o que um desenhista digital precisa.\\nEntão eu fiz um comparativo entre os dois, trazendo alguns pontos importantes que possam te ajudar a escolher um deles pra começar na sua jornada de desenho digital.\\nIntrodução Visão Geral Interface Facilidade de uso Conjunto de recursos Desempenho e Suporte Visão Geral Pra começar eu vou te trazer uma visão geral de cada um dos programas, a começar pelo Krita que é um programa profissional de desenho digital gratuito voltado para diferentes tipos de artistas.\\nNo Krita é possível produzir ilustração, concept art, história em quadrinhos e até animação 2D quadro a quadro. De fato, ele é um programa bem completo tanto para iniciantes como para usuários mais avançados.\\nJá o FireAlpaca é um programa de desenho digital mais simples — mas isso não faz dele uma opção ruim, inclusive há vantagens nisso e eu vou falar sobre elas mais pra frente. O importante é que você saiba que o FireAlpaca consegue te trazer todos os recursos básicos necessários e também te permite, em alguns pontos de forma mais limitada, fazer pinturas digitais, quadrinhos e também animação.\\nResumindo, os dois são gratuitos e vão oferecer os recursos necessários pra você que tá começando agora a desenhar no digital, mas cada um tem vantagens e desvantagens que precisam ser comparadas as suas necessidades atuais.\\nVamos falar sobre algumas delas!\\n1. Interface Falando de interface o Krita é mais agradável — claro, estou comparado a versão standard do Firealpaca.\\nNo Krita temos uma interface mais moderna, com diferentes opções de temas claros e escuros, além de um poder de personalização muito maior que no Firealpaca.\\nExemplo: no Krita conseguimos personalizar o tamanho dos ícones da barra de ferramentas. Por outro lado, a interface do Firealpaca me lembra o visual de sistemas operacionais mais antigos. Numa primeira impressão fica parecendo que é um programa ultrapassado que não tem tanto a oferecer — felizmente, isso não é verdade.\\n2. Facilidade de Uso Em termos de facilidade de uso, quando estamos falando do Krita, nós vamos ter um programa um pouco mais complexo de aprender do que o FireAlpaca. Justamente pela quantidade de recursos e funcionalidades a mais que ele vai ter.\\nPor um lado isso é positivo, porque a longo prazo você sabe que o Krita vai te oferecer \\u0026ldquo;tudo\\u0026rdquo; o que você precisa para criar. Mas, do ponto de vista de um completo iniciante pode ser um pouco desafiador e muitas vezes até frustrante no início. Por isso é importante existirem programas como o FireAlpaca que vai atingir um outro público.\\nEspecialmente, para quem nunca teve contato com outro programa de desenho digital antes, o FireAlpaca parece mais adequado — mesmo que no futuro você precise trocar de programa. Além de simples, o FireAlpaca é rápido de aprender, e para jovens ou usuários inexperientes em ferramentas digitais isso é essencial.\\nSe você gosta do Krita não se preocupa com o nível de dificuldade, você pode resolver isso consumindo tutoriais em vídeo, através das comunidades que falam sobre o Krita ou em cursos introdutórios. Tem muito conteúdo pago e gratuito para aprender sobre ele. 🚀 3. Conjunto de recursos Eu vou chamar de conjunto de recursos as funcionalidades, recursos e ferramentas de cada programa — e no Krita, como você já deve imaginar, vamos ter um conjunto de recursos mais completo. Não à toa no próprio site oficial, eles definem o Krita como um programa de pintura profissional, então é de se esperar que ele seja mais completo mesmo.\\nNo Krita você vai ter acesso a:\\numa biblioteca variada de pincéis para todos os tipos de trabalho, desde pincéis mais voltados pra esboço até pincéis para aquarela, já vem tudo pronto pra uso; criação e edição de diferentes tipos de camadas, inclusive camada do tipo vetorial, que é aquela que te permite redimensionar algo pro tamanho que você quiser sem ter perda de qualidade; timeline de animação bem completa, se você considerar que o foco do Krita não é animação; além disso, o Krita também permite instalar plugins que adicionam novas funções ao programa — permitir expandir funcionalidades é uma das coisas que tornam o Krita ainda mais poderoso. No FireAlpaca nós temos de vantagem:\\ninterface leve e fácil para iniciantes; a ferramenta de correção de traço funciona muito bem e não tem dificuldade pra configurar, perfeito pra quem precisa fazer muito trabalho com lineart; réguas simples de ativar e muito úteis pra quem está fazendo quadrinhos; e o jeito como funcionam as máscaras de camada é bem parecido com o Photoshop, que eu considero bem simples de usar. 4. Desempenho e Suporte Quanto ao desempenho o melhor é baixar cada um dos dois e testar na prática, mas antes veja se o seu computador tem pelo menos os requisitos mínimos de sistema recomendados. No site oficial do Krita você vai encontrar essa informação na página de download.\\nDe maneira geral, se o seu computador é mais básico, escolha o FireAlpaca.\\nFalando de suporte, o Krita vai melhor. É um programa que está sempre trazendo novas atualizações e melhorias importantes.\\nNa versão padrão do FireAlpaca — que é a gratuita, tivemos pequenas atualizações, mas a maioria é sobre correção de bugs.\\n5. Recursos de Aprendizado E por último, e essencial pra você que tá começando agora, os recursos de aprendizado — que são as formas onde você pode buscar ajuda pra aprender sobre o programa que você escolheu usar.\\nPro Krita, a quantidade de informação sobre o programa é bastante ampla e variável. Você vai encontrar tutoriais em vídeo sobre o Krita, tem fórum de ajuda pra dúvidas mais específicas, cursos e eles também tem sua própria documentação oficial.\\nJá pro Firealpaca, além do próprio site e um tutorial ou outro sobre ele, não encontrei tanta coisa assim. Mas acaba sendo o suficiente porque ele não tem tantos recursos assim.\\nConclusão No geral, o Krita mesmo com alguns pontos fracos quando estamos pensando em completos iniciantes no desenho digital, é uma melhor escolha do que o Firealpaca. Porque esses obstáculos iniciais de aprendizado podem ser facilmente resolvidos com tutoriais, cursos e fórum de ajuda.\\nPor outro lado, pra quem tem o problema de ter um PC mais simples e que não rode o Krita com tranquilidade, o FireAlpaca vai ser o programa perfeito.\\n\"","section":"\"blog\""},{"title":"\"Krita para Iniciantes\"","permalink":"\"/cursos/krita-para-iniciantes/\"","description":"\"Nesse curso eu te mostro como usar as ferramentas principais do Krita. Você vai entender exatamente o que precisa para começar no Krita e ganhar confiança para usar o software no seu dia a dia.\"","content":"\"Comece a usar o Krita sem travar Criado pra você que nunca usou o Krita e precisa entender o essencial para começar.\\nVocê não precisa aprender tudo de uma vez — só o que realmente importa para desenhar e colorir com segurança.\\nschool O que você vai aprender Ferramentas e painéis essenciais Entenda o que realmente importa no Krita\\nOrganização do espaço de trabalho Deixe a interface do seu jeito\\nFluxo de desenho e colorização Dicas e ferramentas de desenho e pintura\\nFerramentas e truques extra Conheça mais ferramentas e filtros do próprio Krita\\ngroup Para quem é esse curso check_circle Nunca usou o Krita check_circle Tentou e travou no começo check_circle Quer aprender um programa de desenho digital do zero card_giftcard O que você recebe keyboard Atalhos personalizados Todos os meus atalhos prontos para baixar e instalar no seu Krita.\\nplay_circle Acesso imediato Comece a estudar agora mesmo! Todas as aulas já estão gravadas e organizadas na plataforma da Hotmart, permitindo que você assista no seu ritmo, de onde quiser.\\nforum Grupo exclusivo no Discord ? Receba novidades, atualizações e suporte sobre o curso no nosso servidor exclusivo.\\nsubtitles Curso legendado Todas as aulas do curso contam com legendas completas em português para garantir clareza no aprendizado de cada ferramenta.\\nformat_list_numbered Conteúdo do curso O Krita para Iniciantes tem 6 módulos principais:\\n01 Introdução ao Krita 02 Conceitos básicos 03 Fazendo um desenho 04 Colorindo o desenho 05 Dicas e Truques 06 Solução de problemas Esses 6 módulos fazem parte da base do curso.\\nauto_awesome Módulos extra Além desses módulos também teremos módulos extra pra cobrir outras ferramentas e painéis interessantes:\\nDisponível Animação no Krita Nesse módulo eu mostro as principais ferramentas de animação do Krita. Com essas aulas você vai ter o que precisa pra conseguir criar suas primeiras animações 2D.\\nEM PRODUÇÃO Ferramentas de Quadrinhos Um módulo de
